org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=false


## Environment Properties
minecraft_version=1.20.1
minecraft_version_range=[1.20.1]
forge_version=47.4.23
forge_version_range=[47,)
loader_version_range=[47,)
fabric_api_version=0.92.2+1.11.8+1.20.1
groovy_version=4.0.13
# Test mixin by searching for "MIXIN_WORKING" in logs.
mixin_version=0.12.11+mixin.0.8.5
mixin_extras_version=0.5.5
mixin_conditional=0.6.4

## Mod Selection
# Required Categories - A hard toggle to disable a subset of mods if any requirement
#   is not satisfied. This is intended for debugging.
# Avoid making these dependent on each other to avoid messy dependency trees.
enable_fabric=true
enable_building=true
enable_world=true
enable_tweaks=true
# Optional Categories - A soft toggle to disable a subset of mods if all options are
#   not satisfied. This is intended for KubeJS.
# Dependent Categories - Not strictly required for integration testing
enable_libraries=false
enable_aether=false
# Independent Categories - Contains all mods required for integration testing
enable_lifecycle=true
enable_primitive_technology_1=true
enable_primitive_technology_2=true
enable_technology_3=true
enable_electrical_technology_1=true
enable_mechanical_technology_1=true
enable_electrical_technology_2=true
enable_mechanical_technology_2=true
enable_electrical_technology_3=true
enable_mechanical_technology_3=true

## Mod Properties
mod_id=mobsiege
mod_name=Mobsiege
mod_license=MIT
mod_version=0.2
mod_group_id=com.stockieslad.mobsiege
mod_authors=StockiesLad
mod_description=Java mod containing features that this modpack uses

## Modpack Properties
modpack_version=0.1
dump_parsed_json=true
debug_mod_list=false
backupRun=false
backupPack=false

# /pack/ -> [Copy] -> /runs/
staticAssetFolders=config, defaultconfigs
# /runs/ -> [Sync] -> /pack/
dynamicAssetFolders=kubejs/assets, kubejs/client_scripts, kubejs/config, kubejs/data, kubejs/server_scripts, kubejs/startup_scripts, patchouli_books