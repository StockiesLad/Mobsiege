static void hasCyclicDependencies(Map<String, List<String>> modCategories, List<String> parents, String dependency) {
    // Find category for dependency
    if (dependency.contains("#")) {
        // Get any category for name
        dependency = findCategory(modCategories, dependency);
    } else {
        // Only search for constraints for regular mod
        dependency = "[constraint]:${dependency}"
    }
    // Throw error if there is a cycle
    if (parents.contains(dependency))
        throw new RuntimeException("Cyclic dependency '${dependency}' found in tree: ${parents}");
    // Skip if such dependency is not existent
    if (!modCategories.containsKey(dependency))
        return
    // Iterate for sub-dependencies
    parents.add(dependency);
    modCategories.get(dependency).stream().forEach {subDependency -> {
        hasCyclicDependencies(modCategories, parents, subDependency)
    }}
    parents.remove(dependency)
}

Map<String, Set<String>> applySubCategories(Map<String, List<String>> modCategories) {
    Map<String, Set<String>> newModCategories = new HashMap<>()
    modCategories.forEach {category, entries ->
        newModCategories.put(category, applySubCategory(modCategories, category, new ArrayList<String>()))}
    return newModCategories
}

Set<String> applySubCategory(Map<String, List<String>> modCategories, String workingCategory, List<String> iteratedCategories) {
    // Find the working category actually exists
    workingCategory = findCategory(modCategories, workingCategory);
    // Add working category
    iteratedCategories.add(workingCategory)
    // Iterate for entries
    Set<String> filledEntries = new HashSet<>()
    modCategories.get(workingCategory).forEach {entry ->
        // If entry is non-existent, remove
        if (entry == null || entry.isEmpty())
            return
        // Add normally if it's a regular modid entry
        if (!entry.contains("#"))
            filledEntries.add(entry)
        // Apply subcategories for entry
        else filledEntries.addAll(applySubCategory(modCategories, entry, iteratedCategories))
    }
    // Remove working category: Avoids sibling branches duplicating entries in iterated categories
    iteratedCategories.remove(workingCategory)
    return filledEntries
}

static String findCategory(Map<String, List<String>> modCategories, String rawCategory) {
    rawCategory = rawCategory.replace("#", "")
    String oldName = rawCategory

    if (!rawCategory.contains(":")) {
        for (var type : List.of("optional", "required", "constraint")) {
            if (modCategories.containsKey("[${type}]:${rawCategory}".toString())) {
                rawCategory = "[${type}]:${oldName}"
                break
            }
        }
    }

    if (!oldName.contains(":") && oldName == rawCategory)
        throw new RuntimeException("[ERROR]: Category \"${rawCategory}\" does not exist in ${JsonOutput.prettyPrint(JsonOutput.toJson(modCategories))}!")

    return rawCategory;
}

static String getCategoryName(String rawCategoryName) {
    return rawCategoryName.trim().split(":")[1]
}

// Do not make this static
// Function: Has no unfulfilled requirements & atleast one option
boolean isModEnabled(List<String> listedMods, Map<String, Set<String>> modCategories, String modid) {
    // Save that mod is a dependency
    listedMods.add(modid)
    //Check if modid exists
    if (!modCategories.entrySet().stream().anyMatch {category -> {
        category.value.stream().anyMatch {mod -> mod == modid}
    }}) throw new RuntimeException("${modid} does not exist in mod_categories.json!")
    //Check requirements
    boolean allRequirementsSatisfied = modCategories.entrySet().stream()
            // Get requirements
            .filter{entry -> entry.key.contains("[required]")}
            // Remove categories that are not a requirement of mod
            .filter {entry -> entry.value.stream().anyMatch {categoryModId -> (modid == categoryModId) }}
            // Test all categories to see if they are all enabled
            .allMatch { entry -> providers.gradleProperty("enable_${getCategoryName entry.key}").getOrElse("false").toBoolean()}
    if (!allRequirementsSatisfied)
        return false
    // Check constraints
    boolean allConstraintsSatisfied = modCategories
            .getOrDefault("[constraint]:" + modid, new HashSet<String>()).stream()
            // Checks if all dependencies exist first
            .allMatch {dependency -> isModEnabled(listedMods, modCategories, dependency)}
    if (!allConstraintsSatisfied)
        return false;
    // Check options
    boolean anyOptionsSatisfied = modCategories.entrySet().stream()
            // Get options
            .filter{entry -> entry.key.contains("[optional]")}
            // Remove options that are disabled
            .filter { entry ->
                providers.gradleProperty("enable_${getCategoryName entry.key}").getOrElse("false").toBoolean()}
            // Combine all enabled options' modids
            .flatMap{entry -> entry.value.stream()}
            // Test all categories to see if any are enabled
            .anyMatch{modElement -> (modid == modElement) }
    // Show when mod is loaded
    if (anyOptionsSatisfied && providers.gradleProperty("debug_mod_list").getOrElse("false").toBoolean())
        println("Mod \"${modid}\" loaded: ${anyOptionsSatisfied}")

    return anyOptionsSatisfied
}
