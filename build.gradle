//file:noinspection DependencyNotationArgument
//file:noinspection GroovyImplicitNullArgumentCall
//file:noinspection SpellCheckingInspection

import com.stockieslad.mobsiege.mod_category.ModChecker

plugins {
    id 'eclipse'
    id 'idea'
    id 'java'
    id 'groovy'
    id 'maven-publish'
    id 'net.neoforged.moddev.legacyforge' version '2.+'
    id "modpack"
}

version = mod_version
group = mod_group_id

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

sourceSets {
    main {
        resources {
            srcDir 'src/generated/resources'
        }
        groovy {
            //noinspection GroovyAssignabilityCheck
            srcDir "$rootDir/buildSrc/src/main/groovy/com/stockieslad/$mod_id"
        }
    }
}

legacyForge {
    version = "${minecraft_version}-${forge_version}"

    validateAccessTransformers = true

    mods {
        "${mod_id}" {
            //noinspection GrUnresolvedAccess, GroovyAssignabilityCheck
            sourceSet sourceSets.main
        }
    }

    runs {
        client {
            client()
        }

        server {
            server()
        }

        data {
            data()
        }
    }
}

repositories {
    mavenCentral()
    flatDir {dir 'libs'}
    flatDir {dir 'pack/mods'}

    maven { url 'https://maven.fallenbreath.me/releases' }

    maven {
        url = 'https://api.modrinth.com/maven'
        content { includeGroup 'maven.modrinth' }
    }

    maven {
        url = 'https://curse.cleanroommc.com'
        content { includeGroup 'curse.maven' }
    }

    maven {
        url = "https://maven.su5ed.dev/releases/"
    }

    maven {
        url "https://cursemaven.com"
    }

    maven {
        url = 'https://maven.fabricmc.net/'
    }
}

dependencies {
    annotationProcessor("org.sinytra:sponge-mixin:${mixin_version}")
    compileOnly("org.sinytra:sponge-mixin:${mixin_version}")
    //clientAdditionalRuntimeClasspath project(':mixin-bootstrap') // Do not remove me!
    implementation(jarJar "me.fallenbreath:conditional-mixin-forge:${mixin_conditional}")
    compileOnly(annotationProcessor("io.github.llamalad7:mixinextras-common:${mixin_extras_version}"))
    implementation(jarJar("io.github.llamalad7:mixinextras-forge:${mixin_extras_version}"))
    implementation("org.apache.groovy:groovy:${groovy_version}")
    implementation("org.apache.groovy:groovy-json:${groovy_version}")

    compileOnly "dev.su5ed.sinytra.fabric-api:fabric-api:${fabric_api_version}"
    modCompileOnly("curse.maven:epic-mob-siege-nightmare-957414:5003615")
    modCompileOnly "net.jmb19905:carbonize:1.0.0+1.20.1"
    modCompileOnly(pack.curseforge.cb.multipart)
    modCompileOnly(pack.curseforge.no.tree.punching)
    modCompileOnly(pack.curseforge.tough.as.nails)
