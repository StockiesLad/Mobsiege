legacyForge {
    version = "${minecraft_version}-${forge_version}"

    validateAccessTransformers = true

    mods {
        "${mod_id}" {
            //noinspection GrUnresolvedAccess, GroovyAssignabilityCheck
            sourceSet sourceSets.main
        }
    }

    runs {
        client {
            client()
        }

        server {
            server()
        }

        data {
            data()
        }
    }
}
['runClient', 'runServer'].forEach { name -> {
        tasks.named(name, JavaExec) {
            dependsOn tasks.named("installHotswapAgent")

            getJavaLauncher().set(hotswapJvm)

            jvmArgs(
                    '-XX:+AllowEnhancedClassRedefinition',
                    '-XX:HotswapAgent=core',
                    '-Dhotswapagent.pluginPackages=com.stockieslad.mobsiege.dev'
            )
        }
    }
}