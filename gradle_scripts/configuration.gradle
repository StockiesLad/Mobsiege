import groovy.json.JsonOutput

tasks.register("generateBuildConfigurations") {
    def outputDir = layout.buildDirectory.dir("resources/main/META-INF")
    doLast {
        def dir = outputDir.get().asFile
        dir.mkdirs()

        def modProperties = providers.gradlePropertiesPrefixedBy("").get()

        new File(dir, "build_configuration.json").text = JsonOutput.prettyPrint(JsonOutput.toJson(modProperties))
    }
}

tasks.named("processResources") {
    dependsOn("generateBuildConfigurations")
}