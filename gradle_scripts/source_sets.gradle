sourceSets {
    main {
        resources {
            srcDir 'src/generated/resources'
        }
        groovy {
            srcDirs = ['src/main/groovy', 'src/main/java', "$rootDir/buildSrc/src/main/groovy/com/stockieslad/$mod_id"]

            exclude '**/*Mixin*.java'
            exclude '**/mixin/**'
        }

        java {
            srcDirs = ['src/main/java']
        }
    }
}

mixin {
    add sourceSets.main, "mixins.${mod_id}.refmap.json"
    config "mixins.${mod_id}.json"
}

tasks.named('compileGroovy') {
    classpath = sourceSets.main.compileClasspath

    doLast {
        sourceSets.main.java.classesDirectory.get().asFile.deleteDir()
    }
}

// Java task can rely on the unified output if anything falls back to it
tasks.named('compileJava') {
    dependsOn tasks.named('compileGroovy')
    classpath = sourceSets.main.compileClasspath + files(sourceSets.main.groovy.classesDirectory)
}

tasks.named('jar') { // Replace with 'remapJar' if required by your toolchain
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}