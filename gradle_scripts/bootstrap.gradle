['runClient', 'runServer'].forEach { name -> {
    tasks.named(name, JavaExec) {
        dependsOn tasks.named("installHotswapAgent")

        getJavaLauncher().set(hotswapJvm)

        jvmArgs(
                '-XX:+AllowEnhancedClassRedefinition',
                '-XX:HotswapAgent=core',
                '-Dhotswapagent.pluginPackages=com.stockieslad.mobsiege.dev',
                "-Dconnector.clean.path=${System.getProperty("user.home")}\\.gradle\\caches\\neoformruntime\\artifacts\\minecraft_${minecraft_version}_client.jar"
        )
    }
}}

['runClient', 'runServer', 'runData'].each { name ->
    tasks.named(name) {
        dependsOn(project(":hotswap-agent-reload-plugin").tasks.named("build").get())
        dependsOn(project(":mixin-bootstrap").tasks.named("build").get())
        dependsOn('processStaticAssets')

    }
}